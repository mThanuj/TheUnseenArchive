# Story engine (Milestone 2). Everything creative that should be tunable without code changes.

llm:
  # Order of use (hosted models first, the slow local model last):
  #   1. every provider's BEST models: provider by provider in `chain` order, and within a provider
  #      its models top to bottom. When a model hits its free-tier limit the next model of the SAME
  #      provider is used; only when all of them are limited does it move on to the next provider.
  #   2. then the same for the NORMAL models (`tier: normal`): smaller/faster, still hosted.
  #   3. the local Ollama model.
  # Free limits are per model (Gemini, Groq), so rotating multiplies the free capacity. A used-up
  # daily quota skips that model for the rest of the run. When every hosted model is limited at
  # once, a call waits up to max_wait_s for the first one to free up instead of using the local model.
  # Providers without an API key in .env are skipped. `--provider NAME` forces one provider (still
  # rotating its models). The critique uses a different model than the writer, preferably from
  # another provider (models grade their own work kindly).
  # Model names change: `uv run unseen llm-models --provider NAME` lists what your key can use and
  # which configured models will be tried. In `models`, * stands for a version number, newest first
  # (gemini-*-flash -> gemini-3.8-flash, gemini-3.7-flash, ...).
  chain: [gemini, mistral, groq, cerebras, openrouter, cloudflare, zai, ollama]
  max_wait_s: 300
  cooldown_s: 60
  ollama:
    url: http://127.0.0.1:11434
    # Google's official QAT 4-bit build of the small Gemma 4 (E4B: 4.5B effective parameters),
    # Apache-2.0, ~5 GB. Only used when no hosted model answers, so speed matters more than polish.
    # Pulled by `unseen llm-setup`. (Bigger option: hf.co/google/gemma-4-12B-it-qat-q4_0-gguf, ~7 GB.)
    model: hf.co/google/gemma-4-E4B-it-qat-q4_0-gguf
    # 8k is enough now that repairs/revisions are small targeted calls; a smaller context leaves
    # more of the 4 GB GPU for model layers (faster). Speed tip (optional, then restart Ollama):
    #   setx OLLAMA_FLASH_ATTENTION 1   and   setx OLLAMA_KV_CACHE_TYPE q8_0
    num_ctx: 8192
    # Gemma 4 can "think" before answering; left on, it spends the token budget on hidden reasoning
    # and returns empty content. Ollama's `think` accepts false or a level (low/medium/high/max).
    think: false
    timeout_s: 2400 # CPU generation of a full script can take several minutes
  gemini: # key: https://aistudio.google.com/apikey -> GEMINI_API_KEY
    url: https://generativelanguage.googleapis.com/v1beta
    # Stable models only (no -preview/-image variants), best first: flash models, newest first; the
    # normal tier adds Gemma 4 (free of charge on the same key, own quota) and flash-lite. Free tier:
    # 20 requests per model per day, reset at midnight US Pacific. (gemini-*-pro answered 404 on
    # the free tier in rounds 7-8, so it is not listed.)
    models:
      - "gemini-*-flash"
      # Gemma on the Gemini API thinks at length by default (35-135 s per small call in round 7)
      - { id: gemma-4-31b-it, tier: normal, extra_body: { thinkingConfig: { thinkingLevel: minimal } } }
      - { id: "gemini-*-flash-lite", tier: normal }
      - { id: gemma-4-26b-a4b-it, tier: normal, extra_body: { thinkingConfig: { thinkingLevel: minimal } } }
    timeout_s: 300
    # Gemini "thinks" before answering and those tokens count against the output limit;
    # unbounded thinking truncated long real-mystery scripts. 0 disables thinking (flash only).
    thinking_budget: 1024
    max_output_tokens: 16384
  openai_compat: # OpenAI-compatible APIs
    mistral: # key: https://console.mistral.ai -> API Keys (free "Experiment" mode, no card) -> MISTRAL_API_KEY
      # Free mode: limits are shown in the console (Admin > API > Limits); prompts may be used for
      # training unless you opt out in the console. Story prompts are fiction/public facts only.
      # mistral-large-4-0 is not on the free tier ("not available in your subscription tier").
      url: https://api.mistral.ai/v1
      key_env: MISTRAL_API_KEY
      extra_body: { reasoning_effort: none } # no hidden reasoning eating the output budget
      models:
        - mistral-medium-3-5
        - { id: mistral-small-latest, tier: normal }
    groq: # key: https://console.groq.com/keys -> GROQ_API_KEY (limits are per model)
      url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models:
        # gpt-oss is a reasoning model: hidden reasoning counts against max_tokens and cut scripts off
        - { id: openai/gpt-oss-120b, extra_body: { reasoning_effort: low } }
        - { id: qwen/qwen3.8-27b, tier: normal }
        - { id: openai/gpt-oss-20b, tier: normal, extra_body: { reasoning_effort: low } }
    openrouter: # key: https://openrouter.ai/keys -> OPENROUTER_API_KEY
      # ":free" models: an account-wide cap (50 requests/day) on all free models plus frequent
      # upstream limits per model, so several are listed, all in the normal tier: in rounds 7-9
      # nemotron-3-ultra was "overloaded", gemma-4-31b "rate-limited upstream" on every call, and
      # nemotron-3-super answered but spent its whole budget on hidden reasoning (100-166 s per critique).
      url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      models:
        - { id: "nvidia/nemotron-3-super-120b-a12b:free", tier: normal, extra_body: { reasoning: { effort: low } } }
        - { id: "thinkingmachines/inkling:free", tier: normal }
        - { id: "google/gemma-4-26b-a4b-it:free", tier: normal }
        - { id: "nvidia/nemotron-3-ultra-550b-a55b:free", tier: normal, extra_body: { reasoning: { effort: low } } }
        - { id: "google/gemma-4-31b-it:free", tier: normal }
    cerebras: # key: https://cloud.cerebras.ai -> CEREBRAS_API_KEY
      url: https://api.cerebras.ai/v1
      key_env: CEREBRAS_API_KEY
      models:
        - { id: gpt-oss-120b, extra_body: { reasoning_effort: low } }
    cloudflare: # Workers AI: dash.cloudflare.com -> AI -> Workers AI -> REST API token -> CLOUDFLARE_API_TOKEN
      # + CLOUDFLARE_ACCOUNT_ID. Free: 10,000 "Neurons" per day shared by all models (roughly 10-80
      # script-sized calls depending on the model). Kimi K2.5 now redirects to K2.6, which is paid only.
      url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
      key_env: CLOUDFLARE_API_TOKEN
      models:
        - "@cf/openai/gpt-oss-120b"
        - { id: "@cf/nvidia/nemotron-3-120b-a12b", tier: normal }
        - { id: "@cf/qwen/qwen3.8-27b", tier: normal }
        - { id: "@cf/google/gemma-4-26b-a4b-it", tier: normal }
    zai: # Z.ai (GLM): https://z.ai -> API Keys -> ZAI_API_KEY. The Flash models are listed as free.
      # Model ids taken from the pricing page names; `llm-models --provider zai` confirms them.
      url: https://api.z.ai/api/paas/v4
      key_env: ZAI_API_KEY
      extra_body: { thinking: { type: disabled } }
      models:
        - { id: glm-4.7-flash, tier: normal }
        - { id: glm-4.5-flash, tier: normal }
    nvidia: # NOT in the chain: NVIDIA's free API access is a trial "for prototyping", not for a
      # production channel. Add `nvidia` to llm.chain only for testing. Key: build.nvidia.com -> NVIDIA_API_KEY
      url: https://integrate.api.nvidia.com/v1
      key_env: NVIDIA_API_KEY
      models:
        - { id: z-ai/glm-5.3, extra_body: { reasoning_effort: low } }
        - deepseek-ai/deepseek-v4.1-flash
        - { id: nvidia/nemotron-3-super-120b-a12b, tier: normal,
            extra_body: { chat_template_kwargs: { enable_thinking: false } } }
  temperature:
    concepts: 1.0
    script: 0.8
    critique: 0.2
  max_retries: 2 # re-ask when the output is not valid JSON for the schema

brand:
  name: The Unseen Archive
  tagline: Some stories should never be forgotten.
  narrator: >-
    The Archivist: a calm, precise, slightly weary voice cataloguing recordings that were never
    meant to be seen. Speaks in short, concrete sentences. Never melodramatic, never explains the
    horror; lets details and silences do the work. Opens each entry like a catalogue record
    (entry number, device, where it was recovered) and closes with a single line that lingers.

categories: # weights for daily rotation; never the same category 3 days running
  fiction_horror: { weight: 0.45, label: "Fictional horror" }
  psychological_mystery: { weight: 0.30, label: "Psychological mystery" }
  real_mystery: { weight: 0.25, label: "Documented real-world mystery" }

length: # varied on purpose; seconds of finished Reel
  choices:
    [
      { seconds: 20, weight: 1 },
      { seconds: 30, weight: 3 },
      { seconds: 40, weight: 2 },
      { seconds: 50, weight: 1 },
    ]
  words_per_second: 2.3 # slow, suspenseful narration including pauses
  scene_seconds: { min: 2.0, max: 5.0, typical: 4.0 }
  max_scenes: 12 # one generated clip per scene: also the per-Reel GPU budget

# Ingredients are sampled per story (and cooled down for a few days) to force variety.
ingredients:
  cooldown_stories: 5
  # A 20-50 s Reel holds ONE place, ONE anomaly, ONE reveal. Device, location and anomaly are always
  # used; a twist only sometimes, a narrative structure only for longer Reels.
  twist_probability: 0.5
  structure_probability: 0.3
  structure_min_seconds: 40
  device: # since = first year the device could plausibly record such footage (era checks)
    - { id: camcorder, desc: "early-2000s handheld camcorder", since: 1983 }
    - { id: cctv, desc: "fixed high-angle security camera", since: 1965 }
    - { id: night_vision, desc: "handheld night-vision camera", since: 1990 }
    - { id: phone, desc: "smartphone held vertically", since: 2007 }
    - { id: bodycam, desc: "chest-mounted body camera", since: 2010 }
    - { id: dashcam, desc: "car dashboard camera", since: 2008 }
    - { id: trail_cam, desc: "motion-triggered trail camera in the woods", since: 1995 }
    - { id: webcam, desc: "laptop webcam in a dark room", since: 1997 }
    - { id: film_8mm, desc: "silent 8mm home-movie film", since: 1932 }
    - { id: film_16mm, desc: "16mm documentary or news film camera", since: 1923 }
  location:
    - abandoned hospital wing
    - flooded basement
    - rural motel corridor
    - closed shopping mall at night
    - forest service road
    - lighthouse interior
    - empty school gymnasium
    - apartment stairwell
    - farmhouse kitchen
    - underground parking garage
    - frozen lake at dusk
    - hotel room at 3 a.m.
    - night train carriage
    - cornfield edge
    - storm drain tunnel
    - children's ward playroom (no children present)
    - radio station control room
    - ferry deck in fog
  anomaly:
    - a figure that is closer every time the camera looks back
    - a door that is open in one shot and bricked up in the next
    - a sound that arrives before its source
    - the recording contains footage of the person watching it
    - something mimics the camera operator's voice
    - lights moving in a pattern no one can explain
    - a room that is larger inside than outside
    - every clock in the footage shows the same wrong time
    - a person in the background never moves while everything else does
    - footprints appearing in fresh snow with no one there
    - the camera keeps recording after its battery is removed
    - a missing minute that the timestamp skips
  structure:
    - single continuous recording that gets worse
    - three tapes found in the wrong order
    - before and after the same place, years apart
    - the archivist notices something on the second viewing
    - two cameras that disagree about what happened
    - a log of increasingly short entries
  twist:
    - the watcher is being watched
    - the timeline is reversed
    - the "victim" made the recording afterwards
    - the safe place was the source all along
    - the explanation is mundane, but one detail is not
    - the archive itself appears in the footage

rules:
  min_critique_score: 7 # any dimension below this triggers one revision pass
  hook_max_words: 12
  narration_line_max_words: 22
  # The Archivist states facts; these adjectives tell the viewer how to feel instead of showing it.
  narration_banned_words: [eerie, eerily, mysterious, mysteriously, terrifying, chilling, creepy,
                           sinister, ominous, spine, haunting, unsettling, spooky, macabre]
  # Video models render text as gibberish (and hands writing as melting fingers): any of these, or a
  # quoted string, in a video prompt triggers a scene rewrite.
  video_prompt_text_risk: [written, writes, writing, handwritten, handwriting, reads, printout, printed,
                           typed, label, labelled, labeled, headline, inscription, scrawled, spelled,
                           readout, nameplate, plaque, engraved, engraving, digits, numerals, digital display,
                           newspaper, newspapers, logbook, ledger, poster]
  banned_cliches:
    - it was all a dream
    - the narrator was dead all along
    - ouija board
    - demonic possession
    - jump scare in a mirror
    - "or is it?"
    - little did they know
    - a chill ran down
    - blood dripping from the walls
  # Phrases flagged in video prompts (whole-word match): small video models render them as
  # artefacts or unreadable text. Degradation is added in post-production instead (M4).
  video_prompt_banned_words:
    [
      noise,
      noisy,
      grain,
      grainy,
      film grain,
      vhs,
      glitch,
      glitchy,
      tv static,
      static noise,
      low-resolution,
      low resolution,
      pixelated,
      artifacts,
      artifact,
      artifacting,
      artefact,
      artefacts,
      text,
      subtitles,
      caption,
      watermark,
      logo,
      letters,
      sign that reads,
      gore,
      blood,
    ]
  video_prompt_words: { min: 45, max: 130 }
  content_limits: >-
    Suspense, dread and implication over shock. No gore, no harm to children or animals shown,
    no sexual content, no real living private individuals, no real brands, no slurs, no
    self-harm. Real places may be named only for documented real-world cases. Real victims are
    never shown: no bodies, remains or injuries of real people, on screen or described in detail.

novelty:
  max_similarity: 0.86 # cosine similarity to any past story above this = too similar
  recent_titles_in_prompt: 12 # shown to the model as "do not repeat"

quality:
  rate_concepts: true # the critic model rates the 5 concepts; the best novel one is written (hosted models only)
  drafts: 2 # hosted writer: script the top-N concepts and keep the best-scoring draft (local model: 1)
  revision_rounds: 1 # then rewrite + re-critique this many times; the local model gets one quick patch
  target_avg_score: 7.5 # stop revising once the average reaches this and no score is below min_critique_score

real_mystery:
  min_years_ago_sensitive: 40 # cases where people died or vanished must be historical
  max_source_chars: 9000 # how much article text the model reads (CPU speed)
  # Real cases never show victims: a video prompt with any of these is rewritten to show the place,
  # objects or traces instead (the Dyatlov draft in round 8 asked for a close-up of a dead hiker's head).
  never_show: [body, bodies, corpse, corpses, human remains, skull, skulls, wound, wounds, injury, injuries,
               injured, victim, victims, autopsy, morgue]
  # Any of these marks a line as hedged. Theories/disputed claims need one in every line that uses
  # them; a legend needs one once (the first line that tells it frames the rest).
  hedge_words:
    [
      reportedly,
      according to,
      allegedly,
      some believe,
      some say,
      claimed,
      is said to,
      legend,
      theory,
      theorists,
      may have,
      might have,
      possibly,
      perhaps,
      accounts,
      rumoured,
      rumored,
      supposedly,
      witnesses said,
      never confirmed,
      chronicle,
      chronicles,
      chronicler,
      chroniclers,
      folklore,
      tradition,
      the story goes,
      it is said,
      suggests,
      suggested,
      proposed,
      hypothesis,
      believed,
    ]
