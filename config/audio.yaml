# Milestone 3: narration (text-to-speech) and procedural soundscape. Everything runs on the CPU.

sample_rate: 48000 # the mix; video uses 48 kHz audio

tts:
  # Kokoro-82M (Apache-2.0) on the CPU. The Archivist: calm, precise, slightly weary. Pick the voice
  # by ear: `uv run unseen voices` renders the same line in every voice listed under audition.
  # American voices start with a, British with b; m = male, f = female. Kokoro's own quality grades
  # for the male voices: am_michael/am_fenrir/am_puck C+, bm_george/bm_fable C, bm_lewis D+.
  voice: bm_lewis # chosen by ear in M3 round 1
  speed: 0.88 # slow, deliberate delivery (1.0 = the voice's natural pace)
  sentence_gap_s: 0.3 # an extra beat between the sentences of one line (storyteller cadence)
  last_line_speed: 0.94 # the closing line lingers
  max_speed: 1.0 # a line re-spoken faster to fit its scene never exceeds this
  # per-line delivery tags from the script (models.DeliveryName): speed multiplier, gain in dB
  delivery:
    calm: { speed: 1.0, gain_db: 0.0 }
    flat: { speed: 1.0, gain_db: 0.0 }
    hushed: { speed: 0.95, gain_db: -3.0 }
    tense: { speed: 1.04, gain_db: 0.0 }
    urgent: { speed: 1.08, gain_db: 1.0 }
  audition:
    line: "Entry four twelve. The camera kept recording after the battery was removed. Watch the doorway."
    voices: [am_michael, am_fenrir, am_puck, bm_george, bm_fable, bm_lewis, af_heart, af_bella, bf_emma]

# How the Archivist's voice is treated (ffmpeg, on the narration only): a campfire storyteller -
# a little deeper (pitch down, length kept), warm and close (low boost, softer highs, gentle
# compression), a small room around the voice. `fire_db` adds a crackling fire this many dB under the
# narration (not ducked: it is the storyteller's space, not the footage's). Compare them by ear:
# uv run unseen voices --voices bm_lewis --styles dry,campfire,campfire_fire,deep
narrator:
  style: campfire
  styles:
    dry: {}
    campfire: { pitch_semitones: -1.5, warmth_db: 3.0, air_db: -3.0, room: 0.15, compress: true }
    campfire_fire: { pitch_semitones: -1.5, warmth_db: 3.0, air_db: -3.0, room: 0.15, compress: true, fire_db: -18 }
    deep: { pitch_semitones: -3.0, warmth_db: 4.0, air_db: -4.0, room: 0.2, compress: true }

timing:
  first_lead_in_s: 0.15 # the hook starts almost at once
  lead_in_s: 0.35 # silence before the first line of every other scene
  tail_s: 0.35 # minimum room after a scene's last line before the next scene starts
  max_stretch_s: 1.5 # a scene may run this much longer than planned to fit its narration (the clip is held/slowed in M4)

mix:
  narration_rms_db: -20 # every line is levelled to this before mixing
  ambience_db: -10 # the whole soundscape relative to the narration
  duck_db: -8 # extra cut to the soundscape while the Archivist speaks
  duck_attack_s: 0.08
  duck_release_s: 0.6
  peak_db: -1.0 # before loudness normalisation
  # final mix: gentle compression, gain + peak limiter, then ffmpeg loudnorm (two passes, linear)
  loudness: { integrated_lufs: -14.0, true_peak_db: -1.5, lra: 11.0 }

# Level of each sound in the soundscape (dB). Beds run from their cue to the end of the scene;
# room_tone also plays quietly under every scene so the Reel is never digitally silent, except
# after a `silence` cue (silence before the reveal is a deliberate effect).
sfx_db:
  room_tone: -12
  drone: -4
  hum: -9
  electrical_buzz: -10
  radio_static: -10
  wind: -4
  machine: -8
  water_drip: -6
  breathing: -8
  footsteps: -3
  door: 0
  knock: 0
  impact: 0
  creak: -2
  whisper: -7
  distant_voice: -6
  fire: -6
  rain: -4
  thunder: 0
  crickets: -10
  heartbeat: -6
  whoosh: -4
  flicker: -6
  glass: -2
  rumble: -4
  stream: -6
dropout_s: 0.25 # a `dropout` cue cuts everything for this long (tape dropout)

# Sound from the rendered clips (when a story's scenes have been rendered): frames of every clip go
# to a vision-capable model (Gemini), which lists the sounds the footage would carry, timed within
# each clip; sudden brightness jumps add flicker ticks. These replace the script's cues for that
# scene (its silence/dropout choices are kept). Without clips, the script's cues are used.
frames:
  enabled: true
  per_clip: 4 # frames sent per clip
  max_side: 384 # pixels (smaller = cheaper; enough to see what happens)
  flicker_jump: 0.08 # brightness change between frames (0-1) that counts as a light flicker
  level_db: { quiet: -6.0, medium: 0.0, loud: 4.0 }
